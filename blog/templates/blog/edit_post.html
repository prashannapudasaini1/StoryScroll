
{% extends 'blog/base.html' %}

{% block title %}Edit Post - StoryScroll{% endblock %}

{% block content %}
<section class="edit-post-section py-5">
  <div class="container d-flex justify-content-center">
    <div class="col-lg-10 col-xl-9">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
          <h4 class="fw-bold mb-0 text-dark">
            <i class="bi bi-pencil-square text-primary me-2"></i> Edit Post
          </h4>
        </div>
        <div class="card-body p-4 p-md-5">
          <form method="POST" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <!-- Title -->
            <div class="mb-3">
              <label for="title" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control rounded-3" id="title" name="title" value="{{ post.title }}" required>
            </div>

            <!-- Category -->
            <div class="mb-3">
              <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
              <select class="form-select rounded-3" id="category" name="category" required>
                {% if categories %}
                  {% for cat in categories %}
                    {% if cat.name %}
                      <option value="{{ cat.name }}" {% if post.category == cat.name %}selected{% endif %}>{{ cat.name }}</option>
                    {% else %}
                      <option value="{{ cat }}" {% if post.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endif %}
                  {% endfor %}
                {% else %}
                  <option value="Technology" {% if post.category == 'Technology' %}selected{% endif %}>Technology</option>
                  <option value="Lifestyle" {% if post.category == 'Lifestyle' %}selected{% endif %}>Lifestyle</option>
                  <option value="Travel" {% if post.category == 'Travel' %}selected{% endif %}>Travel</option>
                  <option value="Food" {% if post.category == 'Food' %}selected{% endif %}>Food</option>
                  <option value="Fashion" {% if post.category == 'Fashion' %}selected{% endif %}>Fashion</option>
                  <option value="Health" {% if post.category == 'Health' %}selected{% endif %}>Health</option>
                  <option value="Education" {% if post.category == 'Education' %}selected{% endif %}>Education</option>
                  <option value="Business" {% if post.category == 'Business' %}selected{% endif %}>Business</option>
                  <option value="Entertainment" {% if post.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                  <option value="Other" {% if post.category == 'Other' %}selected{% endif %}>Other</option>
                {% endif %}
              </select>
            </div>

            <!-- Content -->
            <div class="mb-3">
              <label for="content" class="form-label fw-semibold">Content <span class="text-danger">*</span></label>
              <textarea class="form-control rounded-3" id="content" name="content" rows="12" required>{{ post.content }}</textarea>
            </div>

            <!-- Featured Image -->
            <div class="mb-3">
              <label for="featured_image" class="form-label fw-semibold">Featured Image (Optional)</label>
              {% if post.featured_image %}
                <div class="mb-2">
                  <img src="{{ post.featured_image.url }}" alt="Current image" class="img-thumbnail rounded-3" style="max-height: 200px;">
                </div>
              {% endif %}
              <input type="file" class="form-control rounded-3" id="featured_image" name="featured_image" accept="image/*">
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3 mt-5">
                <a href="{% url 'writer_dashboard' %}" class="btn btn-light fw-medium border-0 px-4 py-2">Cancel</a>   
                <button type="submit" class="btn btn-primary px-5 py-2 rounded-3 fw-bold">
                Update Post <i class="bi bi-check2-circle ms-1"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
<style>
  .edit-post-section {
    background: transparent;
  }
  
  input.form-control, select.form-select, textarea.form-control {
    display: block;
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 10px;
    background-color: rgba(255, 255, 255, 0.8);
    transition: all 0.3s ease;
  }
  
  textarea.form-control {
      line-height: 1.8;
  }

  input.form-control:focus, select.form-select:focus, textarea.form-control:focus {
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      border-color: var(--secondary-color);
      background: #fff;
  }
</style>
{% endblock %}
