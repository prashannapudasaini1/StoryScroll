
{% extends 'blog/base.html' %}

{% block title %}Create Post - StoryScroll{% endblock %}

{% block content %}
<section class="create-post-section py-4">
  <div class="container d-flex justify-content-center">
    <div class="col-md-8">
      <div class="card soft-card border-0">
        <div class="card-header bg-primary text-white border-0 rounded-top-4">
          <h3 class="h5 mb-0 d-flex align-items-center">
            <i class="bi bi-plus-circle me-2"></i> Create New Post
          </h3>
        </div>
        <div class="card-body p-4">
          <form method="POST" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <!-- Title -->
            <div class="mb-3">
              <label for="title" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control rounded-3" id="title" name="title" required placeholder="Enter post title">
            </div>

            <!-- Category -->
            <div class="mb-3">
              <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
              <select class="form-select rounded-3" id="category" name="category" required>
                <option value="">Select a category</option>
                {% if categories %}
                  {% for cat in categories %}
                    {% if cat.name %}
                      <option value="{{ cat.name }}">{{ cat.name }}</option>
                    {% else %}
                      <option value="{{ cat }}">{{ cat }}</option>
                    {% endif %}
                  {% endfor %}
                {% else %}
                  <option value="Technology">Technology</option>
                  <option value="Lifestyle">Lifestyle</option>
                  <option value="Travel">Travel</option>
                  <option value="Food">Food</option>
                  <option value="Fashion">Fashion</option>
                  <option value="Health">Health</option>
                  <option value="Education">Education</option>
                  <option value="Business">Business</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                {% endif %}
              </select>
            </div>

            <!-- Content -->
            <div class="mb-3">
              <label for="content" class="form-label fw-semibold">Content <span class="text-danger">*</span></label>
              <textarea class="form-control rounded-3" id="content" name="content" rows="12" required placeholder="Write your story here..."></textarea>
            </div>

            <!-- Featured Image -->
            <div class="mb-3">
              <label for="featured_image" class="form-label fw-semibold">Featured Image (Optional)</label>
              <input type="file" class="form-control rounded-3" id="featured_image" name="featured_image" accept="image/*">
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-2 mt-4">
              <a href="{% url 'writer_dashboard' %}" class="btn btn-secondary px-4 py-2 rounded-3">Cancel</a>
              <button type="submit" class="btn btn-orange px-4 py-2 rounded-3">
                <i class="bi bi-plus-circle me-1"></i> Create Post
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
  .create-post-section {
    background: #f9f5ef;
    min-height: 80vh;
  }

  .soft-card {
    border-radius: 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  .rounded-top-4 {
    border-top-left-radius: 1rem !important;
    border-top-right-radius: 1rem !important;
  }

  .btn-orange {
    background-color: #f39c12;
    color: #fff;
    border: none;
    font-weight: 600;
    transition: background-color 0.3s ease;
  }

  .btn-orange:hover {
    background-color: #e0890b;
    color: #fff;
  }

  input.form-control,
  select.form-select,
  textarea.form-control {
    border-radius: 0.5rem;
    border: 1px solid #e1e1e1;
    padding: 0.625rem 0.75rem;
  }

  .form-label {
    font-size: 0.95rem;
    color: #2d3436;
  }
</style>
{% endblock %}
