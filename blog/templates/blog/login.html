
{% extends 'blog/base.html' %}

{% block title %}Login - StoryScroll{% endblock %}

{% block content %}
<section class="login-section d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0">
          <div class="card-body p-4 p-md-5">

            <!-- Header -->
            <div class="text-center mb-5">
              <div class="icon-circle mb-3 d-inline-block p-3 rounded-circle" style="background: rgba(99, 102, 241, 0.1);">
                <i class="bi bi-person-circle fs-1 text-primary"></i>
              </div>
              <h2 class="fw-bold mb-2">Welcome Back</h2>
              <p class="text-muted mb-0">Sign in to continue your journey</p>
            </div>

            <!-- Form -->
            <form method="POST" novalidate>
              {% csrf_token %}

              <!-- Email -->
              <div class="mb-4">
                <label for="username" class="form-label fw-medium text-secondary">
                  Email <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" required placeholder="john@example.com">
                </div>
              </div>

              <!-- Password -->
              <div class="mb-4">
                <label for="password" class="form-label fw-medium text-secondary">
                  Password <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" required placeholder="********" style="border-radius: 0;">
                  <button class="btn border border-start-0 text-muted" type="button" onclick="togglePassword('password', this)" style="border-color: rgba(0,0,0,0.08) !important; background: rgba(255,255,255,0.8); border-radius: 0 10px 10px 0;">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 mt-2 shadow-sm fw-bold">
                Sign In <i class="bi bi-arrow-right ms-2"></i>
              </button>
            </form>

            <!-- Footer -->
            <div class="text-center mt-5">
              <span class="text-muted">Don't have an account?</span>
              <a href="{% url 'register_reader' %}" class="fw-bold ms-1 text-decoration-none">
                Create one now
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
  .login-section {
    background: transparent;
  }
  
  .input-group-text {
      border-radius: 10px 0 0 10px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.8) !important;
  }
  
  input.form-control {
      /* Handled dynamically by input group */
  }
</style>
<script>
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
}
</script>
{% endblock %}
